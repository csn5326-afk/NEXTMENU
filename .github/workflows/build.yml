name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم الملفات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip -o NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          cp -R ffproje/* . 2>/dev/null || true
          cp -R ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          cp -R NEXTmenu/* . 2>/dev/null || true
          cp -R NEXTmenu/.[!.]* . 2>/dev/null || true
        fi
        echo "--- تم فك الضغط وتنظيم الملفات بنجاح ---"

    # 2. تثبيت أداة Theos الرسمية الأساسية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 3. جلب الـ SDK المستقر والمتوافق مباشرة لتجنب أخطاء الموديولات الحديثة
    - name: Download Stable iOS SDK
      run: |
        rm -rf ~/theos/sdks
        mkdir -p ~/theos/sdks
        # تحميل حزمة SDK إصدار 14.5 المستقرة لتفادي تعارض ملفات النظام الحديثة
        curl -L "https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz" -o ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz
        tar -xf ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz -C ~/theos/sdks/
        rm ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz

    # 4. تجميع المشروع مع فرض معايير التوافق
    - name: Compile Project
      run: |
        export THEOS=~/theos
        
        # إعداد متغيرات التجميع لتجاوز التدقيق الصارم
        export GO_EASY_ON_ME=1
        
        # تشغيل البناء واستهداف بيئة عمل مستقرة
        make FINALPACKAGE=1 HOME=$HOME \
          ARCHS="arm64" \
          TARGET=iphone:clang:14.5:14.0 \
          ADDITIONAL_CFLAGS="-Wno-error -Wno-implicit-function-declaration" \
          ADDITIONAL_CXXFLAGS="-Wno-error -std=c++11"
          
    # 5. رفع ملف الـ dylib النهائي والجاهز للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
