name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم المجلدات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip -o NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          cp -R ffproje/* . 2>/dev/null || true
          cp -R ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          cp -R NEXTmenu/* . 2>/dev/null || true
          cp -R NEXTmenu/.[!.]* . 2>/dev/null || true
        fi

    # 2. حقن وإجبار الـ Makefile على تعطيل الـ Modules من الجذور
    - name: Force Patch Makefile
      run: |
        echo "جاري تعديل وحقن ملف Makefile لإلغاء الموديلات تماماً..."
        
        # إنشاء نسخة احتياطية وتعديل الـ Makefile لإضافة الأوامر الصارمة في أوله
        if [ -f "Makefile" ]; then
          sed -i '' '1i\
        GO_EASY_ON_ME = 1\
        ADDITIONAL_CFLAGS = -fno-modules -fno-implicit-modules -Wno-error\
        ADDITIONAL_CXXFLAGS = -fno-modules -fno-implicit-modules -Wno-error -std=c++11\
        ADDITIONAL_LOGOSFLAGS = -fno-modules\
        ' Makefile
          echo "--- محتوى الـ Makefile بعد التعديل القسري ---"
          cat Makefile
        else
          echo "تحذير: لم يتم العثور على ملف Makefile في المجلد الرئيسي!"
        fi

    # 3. تثبيت أداة Theos الرسمية الأساسية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 4. تحميل الـ SDK المستقر للآيفون
    - name: Download iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/theos/sdks

    # 5. تجميع ملف الـ dylib
    - name: Compile Project
      run: |
        export THEOS=~/theos
        make FINALPACKAGE=1 HOME=$HOME TARGET=iphone:clang:latest:14.0

    # 6. رفع ملف الـ dylib النهائي والجاهز للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
