name: Build dylib

on:
  workflow_dispatch: # يضمن ظهور زر التشغيل اليدوي فوراً

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم المجلدات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          mv ffproje/* .
          mv ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          mv NEXTmenu/* .
          mv NEXTmenu/.[!.]* . 2>/dev/null || true
        fi

        # إنشاء المجلد المفقود
        mkdir -p Source/Includes
        
        # تحميل ملف Vector3.h الأصلي والمعدل بشكل نظيف وآمن من سيرفر خارجي مستقر
        curl -fsSL "https://gist.githubusercontent.com/Ahmad-Developer-AI/7fca99bb30e017614d33eb431105bd27/raw/Vector3.h" -o Source/Includes/Vector3.h
        
        echo "--- تم جلب ملف Vector3.h بنجاح ---"
        ls -la Source/Includes

    # 2. تثبيت أداة Theos الرسمية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 3. تحميل الـ SDK بشكل نظيف ومتوافق
    - name: Download iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/theos/sdks

    # 4. تجميع ملف الـ dylib الفعلي للآيفون (arm64)
    - name: Compile Project
      run: |
        make FINALPACKAGE=1 HOME=$HOME

    # 5. رفع ملف الـ dylib الناتج للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
