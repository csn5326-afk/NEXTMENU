name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم المجلدات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip -o NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          cp -R ffproje/* . 2>/dev/null || true
          cp -R ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          cp -R NEXTmenu/* . 2>/dev/null || true
          cp -R NEXTmenu/.[!.]* . 2>/dev/null || true
        fi

    # 2. حقن ملف Makefile بإعدادات تسمح بالـ Modules مع تجاهل أخطاء التعارض
    - name: Patch Makefile Safely
      run: |
        echo "جاري حقن الـ Flags الذكية داخل ملف Makefile..."
        
        if [ -f "Makefile" ]; then
          # إنشاء ملف مؤقت مجهز بأوامر تخطي الأخطاء
          cat << 'EOF' > Makefile.new
        GO_EASY_ON_ME = 1
        THEOS_IGNORE_MODULES_ERRORS = 1
        ADDITIONAL_CFLAGS = -Wno-error -Wno-implicit-function-declaration -Wno-module-import-in-extern-c -Wno-ignored-attributes
        ADDITIONAL_CXXFLAGS = -Wno-error -Wno-module-import-in-extern-c -Wno-ignored-attributes -std=c++14
        EOF
          
          # دمج محتويات الـ Makefile الأصلي
          cat Makefile >> Makefile.new
          mv Makefile.new Makefile
          
          echo "--- تم تحديث الـ Makefile بنجاح ---"
          cat Makefile
        else
          echo "خطأ: لم يتم العثور على ملف Makefile!"
          exit 1
        fi

    # 3. تثبيت أداة Theos الرسمية الأساسية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 4. تحميل الـ SDK المستقر للآيفون
    - name: Download iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/theos/sdks

    # 5. تجميع ملف الـ dylib مع معمارية arm64
    - name: Compile Project
      run: |
        export THEOS=~/theos
        make FINALPACKAGE=1 HOME=$HOME ARCHS="arm64" TARGET=iphone:clang:latest:14.0

    # 6. رفع ملف الـ dylib النهائي والجاهز للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
