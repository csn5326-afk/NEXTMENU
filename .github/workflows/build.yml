name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم الملفات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip -o NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          cp -R ffproje/* . 2>/dev/null || true
          cp -R ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          cp -R NEXTmenu/* . 2>/dev/null || true
          cp -R NEXTmenu/.[!.]* . 2>/dev/null || true
        fi
        echo "--- تم فك الضغط وتنظيم الملفات بنجاح ---"

    # 2. تثبيت أداة Theos الرسمية الأساسية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 3. جلب الـ SDK المستقر عبر Git مباشرة لتفادي مشاكل فك الضغط والأرشيف
    - name: Download Stable iOS SDK
      run: |
        rm -rf ~/theos/sdks
        # تحميل مستودع الـ SDKs المستقرة بشكل مباشر ونظيف جداً
        git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

    # 4. تجميع المشروع مع معايير التوافق والـ Flags الخاصة بـ Vector3
    - name: Compile Project
      run: |
        export THEOS=~/theos
        export GO_EASY_ON_ME=1
        
        # استخدام معايير بناء مرنة تتخطى أخطاء الموديلات وتدعم أحدث إصدارات iOS بشكل تلقائي
        make FINALPACKAGE=1 HOME=$HOME \
          ARCHS="arm64" \
          TARGET=iphone:clang:16.5:14.0 \
          ADDITIONAL_CFLAGS="-Wno-error -Wno-implicit-function-declaration" \
          ADDITIONAL_CXXFLAGS="-Wno-error -std=c++11"
          
    # 5. رفع ملف الـ dylib النهائي والجاهز للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
