name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف NEXTmenu.zip وتنظيم الملفات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          mv ffproje/* .
          mv ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          mv NEXTmenu/* .
          mv NEXTmenu/.[!.]* . 2>/dev/null || true
        fi

        # حذف سطر Vector3.h المفقود تلقائياً
        if [ -f "Source/Menu.mm" ]; then
          sed -i '/Includes\/Vector3.h/d' Source/Menu.mm
        fi
        
        echo "--- هيكل الملفات الحالي ---"
        ls -la

    # 2. تثبيت أداة Theos الأساسية مع جلب المجلدات الفرعية (Submodules)
    - name: Setup Theos Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make perl git rsync libssl-dev
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 3. تحميل الـ SDK والـ Toolchain (المترجم) لتفادي خطأ clang المفقود
    - name: Download iOS SDK & Toolchain
      run: |
        # تهيئة مجلدات الـ SDK والـ Toolchain
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/theos/sdks
        
        # تحميل المترجم المخصص لنظام لينكس ليتعرف عليه الـ Makefile فوراً
        mkdir -p ~/theos/toolchain/linux/iphone
        curl -LO https://github.com/theos/toolchain/releases/download/v1-linux/linux-arm64-toolchain.tar.lzma
        tar --lzma -xf linux-arm64-toolchain.tar.lzma -C ~/theos/toolchain/linux/iphone/
        rm linux-arm64-toolchain.tar.lzma

    # 4. تجميع ملف الـ dylib الفعلي
    - name: Compile Project
      run: |
        make FINALPACKAGE=1 HOME=$HOME

    # 5. رفع ملف الـ dylib الناتج للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
