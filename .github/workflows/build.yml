name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم المجلدات بشكل تلقائي ونظيف
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip -o NEXTmenu.zip
        
        # نقل الملفات للمجلد الرئيسي لكي يراها الكومبيلر مباشرة
        if [ -d "ffproje" ]; then
          cp -R ffproje/* . 2>/dev/null || true
          cp -R ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          cp -R NEXTmenu/* . 2>/dev/null || true
          cp -R NEXTmenu/.[!.]* . 2>/dev/null || true
        fi

        echo "--- تم فك الضغط وتنظيم ملفات أداة فري فاير بنجاح ---"

    # 2. تثبيت أداة Theos الرسمية الأساسية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 3. تحميل الـ SDK المستقر للآيفون
    - name: Download iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/theos/sdks

    # 4. تجميع ملف الـ dylib الفعلي مع إجبار السيرفر على إيقاف الـ Modules تماماً
    - name: Compile Project
      run: |
        export THEOS=~/theos
        
        # إعداد متغيرات البيئة بشكل صارم لتعطيل الـ Modules وإجبار الكومبيلر على التوافق الكامل
        export GO_EASY_ON_ME=1
        export INITIAL_CFLAGS="-fno-modules -fno-implicit-modules -Wno-error -Wno-implicit-function-declaration"
        export INITIAL_CXXFLAGS="-fno-modules -fno-implicit-modules -Wno-error -std=c++11"
        
        # تشغيل البناء مع تمرير الـ Flags مباشرة لكل مراحل التجميع
        make FINALPACKAGE=1 HOME=$HOME \
          ADDITIONAL_CFLAGS="$INITIAL_CFLAGS" \
          ADDITIONAL_CXXFLAGS="$INITIAL_CXXFLAGS" \
          ADDITIONAL_LOGOSFLAGS="-fno-modules" \
          TARGET=iphone:clang:latest:14.0
          
    # 5. رفع ملف الـ dylib النهائي والجاهز للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
