name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع وتنظيم المجلدات
    - name: Unzip NEXTmenu File
      run: |
        echo "جاري فك ضغط ملف NEXTmenu.zip..."
        unzip -o NEXTmenu.zip
        
        if [ -d "ffproje" ]; then
          cp -R ffproje/* . 2>/dev/null || true
          cp -R ffproje/.[!.]* . 2>/dev/null || true
        elif [ -d "NEXTmenu" ]; then
          cp -R NEXTmenu/* . 2>/dev/null || true
          cp -R NEXTmenu/.[!.]* . 2>/dev/null || true
        fi

    # 2. حقن إعدادات التوافق داخل ملف Makefile بشكل متوافق تماماً مع سيرفر macOS
    - name: Clean & Patch Makefile
      run: |
        echo "جاري إعادة بناء وتعديل ملف Makefile لحظر الموديلات وتجنب أخطاء النظام..."
        
        if [ -f "Makefile" ]; then
          # إنشاء ملف مؤقت وحقن الأوامر الصارمة في البداية لتفادي تعارض الموديلات
          cat << 'EOF' > Makefile.new
        GO_EASY_ON_ME = 1
        ADDITIONAL_CFLAGS = -fno-modules -fno-implicit-modules -Wno-error -Wno-module-import-in-extern-c
        ADDITIONAL_CXXFLAGS = -fno-modules -fno-implicit-modules -Wno-error -Wno-module-import-in-extern-c -std=c++14
        ADDITIONAL_LOGOSFLAGS = -fno-modules
        EOF
          
          # دمج محتوى الـ Makefile الأصلي خلف الإعدادات الجديدة مباشرة
          cat Makefile >> Makefile.new
          mv Makefile.new Makefile
          
          echo "--- تم تحديث وحقن الـ Makefile بنجاح ---"
          cat Makefile
        else
          echo "خطأ: لم يتم العثور على ملف Makefile!"
          exit 1
        fi

    # 3. تثبيت أداة Theos الرسمية الأساسية
    - name: Setup Theos Environment
      run: |
        git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos

    # 4. تحميل الـ SDK المستقر للآيفون
    - name: Download iOS SDK
      run: |
        rm -rf ~/theos/sdks
        git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git ~/theos/sdks

    # 5. تجميع ملف الـ dylib مع إشارة صريحة لمعمارية arm64
    - name: Compile Project
      run: |
        export THEOS=~/theos
        make FINALPACKAGE=1 HOME=$HOME ARCHS="arm64" TARGET=iphone:clang:latest:14.0

    # 6. رفع ملف الـ dylib النهائي والجاهز للتحميل
    - name: Upload Finished dylib
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-dylib
        path: .theos/obj/
